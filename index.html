<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>綠色旅遊測驗</title>
<style>
:root {
  color-scheme: light;
  --ground:        #f7f4ee;
  --surface:       #ffffff;
  --surface-sunk:  #f0ece2;
  --ink:           #20211c;
  --ink-secondary: #5b5c54;
  --ink-muted:     #8c8c81;
  --border:        rgba(32,33,28,0.11);
  --brand:         #2f7d72;
  --brand-deep:    #1f5951;
  --brand-tint:    #e2ede9;
  --brand-tint-2:  #c7dfd8;
  --amber:         #b9702f;
  --amber-tint:    #f3e3d1;
  --pole-a:        #2f7d72;
  --pole-b:        #b9702f;
  --track:         #e6e0d2;
  --shadow:        0 1px 2px rgba(32,33,28,0.06), 0 8px 24px rgba(32,33,28,0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:        #15170f;
    --surface:       #1f2220;
    --surface-sunk:  #191b18;
    --ink:           #f2f0e8;
    --ink-secondary: #b9baae;
    --ink-muted:     #82847a;
    --border:        rgba(242,240,232,0.12);
    --brand:         #59b3a4;
    --brand-deep:    #7fcabc;
    --brand-tint:    #223330;
    --brand-tint-2:  #2a3f3a;
    --amber:         #d99a56;
    --amber-tint:    #3a2e1f;
    --pole-a:        #59b3a4;
    --pole-b:        #d99a56;
    --track:         #2c2e29;
    --shadow:        0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:        #15170f;
  --surface:       #1f2220;
  --surface-sunk:  #191b18;
  --ink:           #f2f0e8;
  --ink-secondary: #b9baae;
  --ink-muted:     #82847a;
  --border:        rgba(242,240,232,0.12);
  --brand:         #59b3a4;
  --brand-deep:    #7fcabc;
  --brand-tint:    #223330;
  --brand-tint-2:  #2a3f3a;
  --amber:         #d99a56;
  --amber-tint:    #3a2e1f;
  --pole-a:        #59b3a4;
  --pole-b:        #d99a56;
  --track:         #2c2e29;
  --shadow:        0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  line-height: 1.7;
}
.page {
  max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--surface);
  position: relative; overflow: hidden; box-shadow: var(--shadow);
}
.blob { position: absolute; border-radius: 50%; z-index: 0; pointer-events: none; }
.blob-1 { width: 240px; height: 240px; background: var(--brand-tint); top: -90px; left: -90px; }
.blob-2 { width: 150px; height: 150px; background: var(--brand-tint-2); top: 140px; right: -70px; opacity: .8; }
.content { position: relative; z-index: 1; padding: 40px 26px 48px; }

.eyebrow {
  text-align: center; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 700; margin: 0 0 10px;
}
h1 {
  font-family: "Noto Serif TC", "Songti TC", serif; font-size: 28px; font-weight: 700;
  text-align: center; margin: 0 0 12px; text-wrap: balance; letter-spacing: .01em;
}
.tagline {
  text-align: center; font-size: 14.5px; font-style: italic; color: var(--brand-deep);
  font-weight: 600; margin: 0 0 32px;
}
.section-label {
  font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-muted); margin: 0 0 12px;
}

/* ---------- 開頭 ---------- */
.intro-lede { font-size: 15px; color: var(--ink-secondary); margin: 0 0 26px; }
.intro-lede p { margin: 0 0 14px; }
.intro-meta {
  font-size: 12.5px; color: var(--ink-muted); text-align: center; margin: 18px 0 0;
}

/* ---------- 題目 ---------- */
.progress-wrap { margin-bottom: 26px; }
.progress-text {
  display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-muted);
  font-weight: 700; margin-bottom: 7px; font-variant-numeric: tabular-nums;
}
.progress-track { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
.progress-fill { height: 100%; background: var(--brand); border-radius: 3px; transition: width .3s ease; }

.question-stem {
  font-size: 17px; font-weight: 700; line-height: 1.65; margin: 0 0 22px; text-wrap: pretty;
}
.options { display: flex; flex-direction: column; gap: 11px; }
.option {
  text-align: left; width: 100%; font: inherit; font-size: 14.5px; line-height: 1.65;
  color: var(--ink); background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 14px; padding: 15px 17px; cursor: pointer; transition: border-color .15s, background .15s;
}
.option:hover { border-color: var(--brand); background: var(--brand-tint); }
.option:active { transform: scale(0.995); }
.option:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.back-link {
  display: block; margin: 22px auto 0; background: none; border: none; font: inherit;
  font-size: 13px; color: var(--ink-muted); cursor: pointer; text-decoration: underline;
}

/* ---------- 結果頁 ---------- */
.task-card {
  background: var(--amber-tint); border: 1px solid rgba(185,112,47,0.3); border-radius: 18px;
  padding: 22px 22px 20px; margin-bottom: 34px;
}
.task-card .task-name { font-size: 16px; font-weight: 800; margin: 0 0 8px; }
.task-card .task-lede { font-size: 15px; line-height: 1.75; color: var(--ink); margin: 0 0 12px; }
.task-card .task-link { font-size: 13.5px; font-weight: 700; color: var(--brand-deep); text-decoration: none; }
.task-card .task-link:hover { text-decoration: underline; }

.spectrum-block { margin-bottom: 34px; }
.spectrum-row { margin-bottom: 20px; }
.spectrum-row:last-child { margin-bottom: 0; }
.spectrum-labels {
  display: flex; justify-content: space-between; font-size: 12.5px;
  color: var(--ink-secondary); margin-bottom: 8px; font-weight: 700;
}
.spectrum-track { position: relative; height: 8px; border-radius: 4px; background: var(--track); }
.spectrum-fill-bg {
  position: absolute; inset: 0; border-radius: 4px;
  background: linear-gradient(90deg, var(--pole-a), var(--pole-b)); opacity: .3;
}
.spectrum-dot {
  position: absolute; top: 50%; width: 17px; height: 17px; border-radius: 50%;
  background: var(--ink); border: 3px solid var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  transform: translate(-50%, -50%);
}
.spectrum-value { text-align: center; font-size: 11.5px; color: var(--ink-muted); margin-top: 7px; }

.resource-card {
  border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px;
  margin-bottom: 10px; background: var(--surface);
}
.resource-card:last-child { margin-bottom: 0; }
.resource-card a { font-size: 14px; font-weight: 700; color: var(--brand-deep); text-decoration: none; }
.resource-card a:hover { text-decoration: underline; }
.resource-place { font-size: 11.5px; color: var(--ink-muted); margin-top: 3px; }
.resource-desc { font-size: 12.5px; color: var(--ink-secondary); margin-top: 5px; line-height: 1.6; }

.actions { display: flex; gap: 10px; margin-top: 36px; }
.btn {
  flex: 1; text-align: center; font: inherit; font-size: 14.5px; font-weight: 700;
  padding: 14px 0; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--brand); background: transparent; color: var(--brand-deep);
}
.btn.primary { background: var(--brand); color: #fff; }
.btn.wide { width: 100%; }
.btn:active { transform: scale(0.98); }

.share-note { text-align: center; font-size: 12px; color: var(--ink-muted); margin-top: 12px; min-height: 16px; }
.share-note input {
  width: 100%; margin-top: 6px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
  font-size: 11.5px; box-sizing: border-box; background: var(--surface-sunk); color: var(--ink);
}
.footer-credit { text-align: center; font-size: 11px; color: var(--ink-muted); margin-top: 30px; line-height: 1.6; }
.disclaimer { text-align: center; font-size: 10.5px; color: var(--ink-muted); margin-top: 14px; line-height: 1.8; }
.error-box {
  border: 1px solid rgba(185,112,47,0.4); background: var(--amber-tint);
  border-radius: 14px; padding: 16px 18px; font-size: 14px; line-height: 1.7;
}
</style>
</head>
<body>
<div class="page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="content" id="app"></div>
</div>

<script src="data/quiz-data.js"></script>
<script>
(function () {
  "use strict";

  // Apps Script 部署後的網址；留空則完全不送出任何記錄
  var TRACK_ENDPOINT = "https://script.google.com/macros/s/AKfycbxWuWXtUPvDaTTXq7dYP9V232OpgKz_USdulfSOtKeDQFuGoo9H-B51rTVmGeT-Lw6B/exec";

  var DATA = window.QUIZ_DATA;
  var app = document.getElementById("app");

  // 作答狀態
  var state = null;

  function resetState() {
    state = {
      phase: "intro",   // intro | step1 | step2 | result
      index: 0,         // 目前第幾題
      step1: [],        // 每題選到的地區類型
      step2: [],        // 每題選到的 { key, know, depth }
      area: null,       // Step 1 算出來的地區類型（不會顯示給使用者）
      result: null,
      finishTracked: false // 這次作答的「完成」事件是否已經送過，避免重複記錄
    };
  }

  // ---------- 計分 ----------

  // Step 1：選中的類型 +4、其餘三型各 +1；平手時以標記「平手決勝題」的那題為準
  function resolveArea() {
    var scores = {};
    DATA.areas.forEach(function (a) { scores[a] = 0; });
    state.step1.forEach(function (picked) {
      DATA.areas.forEach(function (a) { scores[a] += (a === picked) ? 4 : 1; });
    });

    var max = -Infinity;
    DATA.areas.forEach(function (a) { if (scores[a] > max) max = scores[a]; });
    var tied = DATA.areas.filter(function (a) { return scores[a] === max; });
    if (tied.length === 1) return tied[0];

    // 平手：先看決勝題選了什麼
    for (var i = 0; i < DATA.step1.length; i++) {
      if (DATA.step1[i].tiebreak && tied.indexOf(state.step1[i]) !== -1) {
        return state.step1[i];
      }
    }
    // 決勝題也沒幫上忙，就用最後一題的選擇
    for (var j = state.step1.length - 1; j >= 0; j--) {
      if (tied.indexOf(state.step1[j]) !== -1) return state.step1[j];
    }
    return tied[0];
  }

  // Step 2：選中的主線任務 +4、其餘各 +1；平手時以最後一題的選擇為準
  function resolveActivity(area) {
    var acts = DATA.activities[area] || [];
    var scores = {};
    acts.forEach(function (a) { scores[a.region] = 0; });
    state.step2.forEach(function (ans) {
      acts.forEach(function (a) { scores[a.region] += (a.region === ans.key) ? 4 : 1; });
    });

    var max = -Infinity;
    acts.forEach(function (a) { if (scores[a.region] > max) max = scores[a.region]; });
    var tied = acts.filter(function (a) { return scores[a.region] === max; });
    if (tied.length === 1) return tied[0];

    for (var i = state.step2.length - 1; i >= 0; i--) {
      var last = state.step2[i].key;
      for (var j = 0; j < tied.length; j++) {
        if (tied[j].region === last) return tied[j];
      }
    }
    return tied[0];
  }

  // 兩條光譜：每條由 2 題累加（-4 ~ +4），換算成 0 ~ 100 的位置
  function resolveSpectra() {
    var know = 0, depth = 0;
    state.step2.forEach(function (ans) {
      know += ans.know;
      depth += ans.depth;
    });
    return {
      know: Math.round((know + 4) / 8 * 100),
      depth: Math.round((depth + 4) / 8 * 100)
    };
  }

  // 光譜文字（不顯示分數，只講傾向）
  function spectrumWord(pos, leftLabel, rightLabel) {
    if (pos < 45) return "偏" + leftLabel;
    if (pos <= 55) return "既是" + leftLabel + "也是" + rightLabel;
    return "偏" + rightLabel;
  }

  // ---------- 畫面 ----------

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function safeUrl(u) {
    var s = String(u || "").trim();
    return /^https?:\/\//i.test(s) ? s : "";
  }

  // ---------- 分享連結（把結果編進網址，收到連結的人才看得到同一個結果） ----------

  function clampPct(n) {
    return Math.max(0, Math.min(100, Math.round(n)));
  }

  function buildResultQuery(area, act, sp) {
    var p = new URLSearchParams();
    p.set("a", area);
    p.set("r", act.region);
    p.set("k", sp.know);
    p.set("d", sp.depth);
    return "?" + p.toString();
  }

  function parseResultFromUrl() {
    var p;
    try { p = new URLSearchParams(location.search); } catch (e) { return null; }
    var area = p.get("a"), region = p.get("r");
    var know = Number(p.get("k")), depth = Number(p.get("d"));
    if (!area || !region || !isFinite(know) || !isFinite(depth)) return null;

    var acts = (DATA.activities || {})[area];
    if (!acts) return null;
    var act = null;
    for (var i = 0; i < acts.length; i++) {
      if (acts[i].region === region) { act = acts[i]; break; }
    }
    if (!act) return null;

    return {
      activity: act,
      spectra: { know: clampPct(know), depth: clampPct(depth) },
      resources: (DATA.resources[act.region] || []).slice(0, 3)
    };
  }

  // ---------- 匿名使用記錄（只送「載入／開始／完成」三種事件，端點留空就整段跳過） ----------

  var UID_KEY = "gtq_uid";
  var ATTEMPTS_KEY = "gtq_attempts";

  function getUid() {
    try {
      var uid = localStorage.getItem(UID_KEY);
      if (!uid) {
        if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
          uid = crypto.randomUUID();
        } else {
          uid = Math.random().toString(36).slice(2) + Date.now().toString(36);
        }
        localStorage.setItem(UID_KEY, uid);
      }
      return uid;
    } catch (e) { return ""; }
  }

  function getAttempts() {
    try {
      var n = parseInt(localStorage.getItem(ATTEMPTS_KEY), 10);
      return isNaN(n) ? 0 : n;
    } catch (e) { return 0; }
  }

  function bumpAttempts() {
    try { localStorage.setItem(ATTEMPTS_KEY, String(getAttempts() + 1)); } catch (e) { /* 忽略 */ }
  }

  function isTestMode() {
    try { return new URLSearchParams(location.search).get("test") === "1"; } catch (e) { return false; }
  }

  // extra 只有「完成」事件會帶：{ area, activity, know, depth }
  function track(eventName, extra) {
    if (!TRACK_ENDPOINT) return;
    try {
      var payload = {
        event: eventName,
        uid: getUid(),
        attempt: getAttempts(),
        area: (extra && extra.area) || "",
        activity: (extra && extra.activity) || "",
        know: (extra && extra.know != null) ? extra.know : "",
        depth: (extra && extra.depth != null) ? extra.depth : "",
        source: isTestMode() ? "測試" : "正式"
      };
      fetch(TRACK_ENDPOINT, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        keepalive: true
      }).catch(function () { /* 忽略：離線或端點掛掉都不影響使用者 */ });
    } catch (e) { /* 忽略：記錄絕不能擋住畫面 */ }
  }

  function render() {
    if (state.phase === "intro") return renderIntro();
    if (state.phase === "result") return renderResult();
    return renderQuestion();
  }

  function renderIntro() {
    app.innerHTML =
      '<p class="eyebrow">綠色旅遊測驗</p>' +
      '<h1>下一趟旅行，<br>你可以順手做一件事</h1>' +
      '<div class="intro-lede">' +
        '<p>很多人有環保的心，但旅遊時不知道當地有什麼可以參與的資源。</p>' +
        '<p>八個問題，帶你找到一個真實存在、現在就報得到名的在地綠色行動——還有你自己的旅人性格。</p>' +
      '</div>' +
      '<button class="btn primary wide" id="startBtn">開始測驗</button>' +
      '<p class="intro-meta">約 8 題・2 分鐘</p>' +
      footerHtml();
    document.getElementById("startBtn").addEventListener("click", function () {
      track("開始");
      state.phase = "step1";
      state.index = 0;
      render();
    });
  }

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function currentQuestion() {
    if (state.phase === "step1") return DATA.step1[state.index];
    return (DATA.step2[state.area] || [])[state.index];
  }

  function renderQuestion() {
    var q = currentQuestion();
    if (!q) { finish(); return; }

    var total = DATA.step1.length + ((DATA.step2[state.area] || []).length ||
      (DATA.step2[DATA.areas[0]] || []).length);
    var done = (state.phase === "step1" ? state.index : DATA.step1.length + state.index);
    var pct = Math.round(done / total * 100);

    var opts = shuffled(q.options);
    var optionsHtml = opts.map(function (opt, i) {
      return '<button class="option" data-i="' + i + '">' + esc(opt.text) + '</button>';
    }).join("");

    app.innerHTML =
      '<div class="progress-wrap">' +
        '<div class="progress-text"><span>問題 ' + (done + 1) + ' / ' + total + '</span><span>' + pct + '%</span></div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<p class="question-stem">' + esc(q.stem) + '</p>' +
      '<div class="options">' + optionsHtml + '</div>' +
      (done > 0 ? '<button class="back-link" id="backBtn">← 回上一題</button>' : "");

    Array.prototype.forEach.call(app.querySelectorAll(".option"), function (btn) {
      btn.addEventListener("click", function () {
        answer(opts[Number(btn.getAttribute("data-i"))]);
      });
    });
    var back = document.getElementById("backBtn");
    if (back) back.addEventListener("click", goBack);
  }

  function answer(opt) {
    if (state.phase === "step1") {
      state.step1[state.index] = opt.area;
      state.index++;
      if (state.index >= DATA.step1.length) {
        // 這裡算出地區類型，但不告訴使用者，直接接著問下一批題目
        state.area = resolveArea();
        state.phase = "step2";
        state.index = 0;
        state.step2 = [];
      }
    } else {
      state.step2[state.index] = { key: opt.key, know: opt.know, depth: opt.depth };
      state.index++;
      if (state.index >= (DATA.step2[state.area] || []).length) {
        finish();
        return;
      }
    }
    render();
  }

  function goBack() {
    if (state.phase === "step2" && state.index === 0) {
      state.phase = "step1";
      state.index = DATA.step1.length - 1;
      state.area = null;
      state.step2 = [];
    } else if (state.index > 0) {
      state.index--;
    }
    render();
  }

  function finish() {
    var act = resolveActivity(state.area);
    var sp = resolveSpectra();
    state.result = {
      activity: act,
      spectra: sp,
      resources: (DATA.resources[act.region] || []).slice(0, 3)
    };
    state.phase = "result";
    if (!state.finishTracked) {
      state.finishTracked = true;
      track("完成", { area: state.area, activity: act.region, know: sp.know, depth: sp.depth });
      bumpAttempts();
    }
    try {
      history.replaceState(null, "", location.pathname + buildResultQuery(state.area, act, sp));
    } catch (e) { /* 忽略 */ }
    render();
  }

  function renderResult() {
    var act = state.result.activity;
    var sp = state.result.spectra;
    var url = safeUrl(act.url);

    var resourcesHtml = state.result.resources.map(function (r) {
      var ru = safeUrl(r.url);
      var head = ru
        ? '<a href="' + esc(ru) + '" target="_blank" rel="noopener">' + esc(r.name) + ' ↗</a>'
        : '<span style="font-size:14px;font-weight:700;">' + esc(r.name) + "</span>";
      return '<div class="resource-card">' + head +
        '<div class="resource-place">' + esc(r.region) + "・" + esc(r.category) + "</div>" +
        '<div class="resource-desc">' + esc(r.desc) + "</div></div>";
    }).join("");

    app.innerHTML =
      '<p class="eyebrow">你的測驗結果是</p>' +
      "<h1>" + esc(act.short) + "．" + esc(act.theme) + "</h1>" +
      '<p class="tagline">「' + esc(act.tagline) + '」</p>' +

      '<p class="section-label">主線任務</p>' +
      '<div class="task-card">' +
        '<p class="task-name">' + esc(act.name) + "</p>" +
        '<p class="task-lede">' + esc(act.desc) + "</p>" +
        (url ? '<a class="task-link" href="' + esc(url) + '" target="_blank" rel="noopener">看看怎麼參加 ↗</a>' : "") +
      "</div>" +

      '<p class="section-label">你的旅人性格</p>' +
      '<div class="spectrum-block">' +
        spectrumHtml("知識派", "實踐派", sp.know) +
        spectrumHtml("深度旅遊派", "廣度旅遊派", sp.depth) +
      "</div>" +

      (resourcesHtml ? '<p class="section-label">延伸資源</p>' + resourcesHtml : "") +

      '<div class="actions">' +
        '<button class="btn" id="restartBtn">🔄 重新測驗</button>' +
        '<button class="btn primary" id="shareBtn">📤 分享結果</button>' +
      "</div>" +
      '<div class="share-note" id="shareNote"></div>' +
      footerHtml() +
      '<p class="disclaimer">本測驗推薦的行動與資源為 2026 年 9 月查證，實際梯次、開放時間與費用可能異動，出發前請以主辦單位公告為準。</p>';

    document.getElementById("restartBtn").addEventListener("click", restartQuiz);
    document.getElementById("shareBtn").addEventListener("click", shareResult);
  }

  // 把 0~100 的分數壓縮到 8~92%，這樣就算選滿 +4/-4，圓點也不會貼在軌道最邊緣
  function spectrumDotPos(pos) {
    var clamped = Math.max(0, Math.min(100, pos));
    return 8 + clamped * 0.84;
  }

  function spectrumHtml(left, right, pos) {
    var clamped = Math.max(0, Math.min(100, pos));
    return '<div class="spectrum-row">' +
      '<div class="spectrum-labels"><span>' + esc(left) + "</span><span>" + esc(right) + "</span></div>" +
      '<div class="spectrum-track"><div class="spectrum-fill-bg"></div>' +
      '<div class="spectrum-dot" style="left:' + spectrumDotPos(clamped) + '%"></div></div>' +
      '<p class="spectrum-value">' + esc(spectrumWord(clamped, left, right)) + "</p></div>";
  }

  function footerHtml() {
    return '<p class="footer-credit">堉璘臺大人才培育計畫 · 綠色旅遊測驗</p>';
  }

  // ---------- 重新測驗／分享（沙箱環境也不會壞） ----------

  function restartQuiz() {
    try { history.replaceState(null, "", location.pathname); } catch (e) { /* 忽略 */ }
    resetState();
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* 忽略 */ }
  }

  function shareResult() {
    var url;
    try { url = location.href; } catch (e) { url = ""; }
    var note = document.getElementById("shareNote");
    var act = state.result ? state.result.activity : null;
    var title = act ? act.short + "．" + act.theme : "綠色旅遊測驗";

    function showFallback() {
      note.innerHTML = '複製這段連結分享給朋友：<input type="text" readonly value="' + esc(url) + '" onclick="this.select()">';
      var input = note.querySelector("input");
      if (input) { input.focus(); input.select(); }
    }

    if (navigator.share) {
      navigator.share({
        title: title,
        text: "我測出了「" + title + "」，換你測測看！",
        url: url
      }).catch(showFallback);
      return;
    }
    if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        note.textContent = "連結已複製，貼給朋友就可以了 ✅";
      }).catch(showFallback);
      return;
    }
    showFallback();
  }

  // ---------- 啟動 ----------

  if (!DATA || !DATA.step1 || !DATA.step1.length) {
    app.innerHTML =
      '<p class="eyebrow">載入失敗</p>' +
      "<h1>題目資料沒有載入</h1>" +
      '<div class="error-box">找不到 <code>data/quiz-data.js</code>，或它是空的。' +
      "請在專案根目錄執行 <code>python tools/xlsx_to_js.py</code> 重新產生題目資料，再重新整理這個頁面。</div>";
  } else {
    resetState();
    track("載入");
    var shared = parseResultFromUrl();
    if (shared) {
      state.phase = "result";
      state.result = shared;
    }
    render();
  }
})();
</script>
</body>
</html>
