<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你是哪種護島人？ — 台灣環保性格測驗</title>
<style>
/* ============================================================
   色彩系統
   四個議題類別對應四個通過色盲/對比驗證的固定色票（順序不可調換，
   調換相鄰順序可能無法通過色盲辨識度檢查）：
     🌊 海洋與海廢       --c-ocean    藍
     ☀️ 氣候與能源行動    --c-climate  橘
     🌲 山林與生物多樣性  --c-forest   青綠
     ♻️ 循環經濟與永續生活 --c-circular 黃
   ============================================================ */
.viz-root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --page-plane:      #eef6f4;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --border-hairline: rgba(11,11,11,0.10);
  --gridline:       #e1e0d9;

  --c-ocean:    #2a78d6;
  --c-climate:  #eb6834;
  --c-forest:   #1baf7a;
  --c-circular: #eda100;

  --brand-mint-1: #dcece9;
  --brand-mint-2: #aed7d0;
  --brand-teal:   #4a9b92;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
  background: var(--page-plane);
  color: var(--text-primary);
  min-height: 100vh;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--surface-1);
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.06);
  display: flex;
  flex-direction: column;
}

/* 裝飾用的圓形色塊，呼應原企劃書封面的視覺語言 */
.blob { position: absolute; border-radius: 50%; z-index: 0; pointer-events: none; }
.blob-1 { width: 260px; height: 260px; background: var(--brand-mint-1); top: -80px; left: -100px; }
.blob-2 { width: 150px; height: 150px; background: var(--brand-mint-2); bottom: 40px; right: -60px; }
.blob-3 { width: 90px;  height: 90px;  background: var(--brand-teal); opacity: .35; top: 200px; right: 20px; }

.screen { position: relative; z-index: 1; padding: 32px 24px 40px; flex: 1; display: none; flex-direction: column; }
.screen.active { display: flex; }

/* ---------- 首頁 ---------- */
#screen-intro { justify-content: center; text-align: center; min-height: 100vh; }
.intro-badge {
  font-size: 13px; letter-spacing: .08em; color: var(--brand-teal);
  font-weight: 700; margin-bottom: 14px;
}
.intro-title { font-size: 30px; font-weight: 800; line-height: 1.35; margin: 0 0 12px; }
.intro-sub { font-size: 15px; color: var(--text-secondary); line-height: 1.7; margin: 0 0 28px; }
.intro-meta {
  display: flex; justify-content: center; gap: 18px; font-size: 13px;
  color: var(--text-muted); margin-bottom: 32px;
}
.intro-meta span { display: flex; align-items: center; gap: 6px; }

.btn-primary {
  background: var(--brand-teal); color: #fff; border: none; border-radius: 999px;
  padding: 15px 36px; font-size: 16px; font-weight: 700; cursor: pointer;
  box-shadow: 0 8px 20px rgba(74,155,146,0.35);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(74,155,146,0.45); }
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  background: transparent; color: var(--brand-teal); border: 1.5px solid var(--brand-teal);
  border-radius: 999px; padding: 13px 30px; font-size: 15px; font-weight: 700; cursor: pointer;
}

.preview-types { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
.preview-chip {
  width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 20px; color: #fff;
}

/* ---------- 題目頁 ---------- */
#screen-quiz { padding-top: 24px; }
.progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.progress-track { flex: 1; height: 6px; background: var(--gridline); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--brand-teal); border-radius: 4px; transition: width .3s ease; width: 0%; }
.progress-label { font-size: 13px; color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.question-text { font-size: 20px; font-weight: 700; line-height: 1.6; margin: 8px 0 26px; min-height: 96px; }

.options { display: flex; flex-direction: column; gap: 12px; }
.option-btn {
  text-align: left; padding: 16px 18px; border-radius: 16px; border: 1.5px solid var(--border-hairline);
  background: var(--surface-1); font-size: 15px; line-height: 1.5; color: var(--text-primary);
  cursor: pointer; transition: border-color .15s ease, background .15s ease, transform .1s ease;
}
.option-btn:hover { border-color: var(--brand-teal); background: #f4faf9; }
.option-btn:active { transform: scale(0.99); }
.option-btn.selected { border-color: var(--brand-teal); background: #e9f5f3; }

.quiz-nav { margin-top: 24px; }
.back-link { background:none; border:none; color: var(--text-muted); font-size: 13px; cursor: pointer; padding: 6px 0; }

/* ---------- 過場頁 ---------- */
#screen-loading { justify-content: center; align-items: center; text-align: center; min-height: 100vh; }
.loading-emoji { font-size: 44px; margin-bottom: 18px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: .6; } }
.loading-text { font-size: 15px; color: var(--text-secondary); }

/* ---------- 結果頁 ---------- */
#screen-result { padding-top: 36px; }
.result-hero { text-align: center; margin-bottom: 28px; }
.result-emoji { font-size: 56px; margin-bottom: 10px; }
.result-eyebrow { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
.result-name { font-size: 28px; font-weight: 800; margin: 0 0 8px; }
.result-tagline { font-size: 15px; font-style: italic; color: var(--brand-teal); margin: 0 0 16px; font-weight: 600; }
.result-desc { font-size: 14.5px; line-height: 1.8; color: var(--text-secondary); text-align: left; margin: 0 0 18px; }

.tag-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 8px; }
.tag-pill {
  font-size: 12.5px; padding: 6px 14px; border-radius: 999px; background: var(--brand-mint-1);
  color: var(--brand-teal); font-weight: 700;
}

.section-title {
  font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--text-muted);
  text-transform: uppercase; margin: 30px 0 14px;
}

/* 議題指數 — meter / progress track 元件
   四個類別固定順序顯示（不依分數排序），確保色票相鄰組合維持在
   已驗證過的色盲安全順序：藍(海洋)→橘(氣候)→青綠(山林)→黃(循環)
   每個 meter 都附上文字標籤與數值，符合對比不足色塊須有可見標籤的規則 */
.meter-list { display: flex; flex-direction: column; gap: 16px; }
.meter-row { display: flex; flex-direction: column; gap: 6px; }
.meter-label-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; }
.meter-label { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.meter-value { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--text-primary); }
.meter-track { height: 10px; border-radius: 5px; background: var(--gridline); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 5px; transition: width .6s ease; }

.resource-card {
  border: 1.5px solid var(--border-hairline); border-radius: 14px; padding: 14px 16px;
  margin-bottom: 10px; background: var(--surface-1);
}
.resource-card a { font-size: 14.5px; font-weight: 700; color: var(--brand-teal); text-decoration: none; }
.resource-card a:hover { text-decoration: underline; }
.resource-desc { font-size: 13px; color: var(--text-secondary); margin-top: 4px; line-height: 1.6; }

.task-box {
  background: #fff8e8; border: 1.5px solid #f0dca0; border-radius: 14px; padding: 16px 18px;
  font-size: 14px; line-height: 1.7; color: #6b5620;
}
.task-box strong { display: block; margin-bottom: 4px; color: #8a6d10; font-size: 13px; }

.result-actions { display: flex; gap: 10px; margin-top: 30px; }
.result-actions button { flex: 1; }
.share-note { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 10px; min-height: 16px; }

.footer-credit { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 36px; line-height: 1.6; }
</style>
</head>
<body class="viz-root">
<div class="app">

  <!-- ============ 首頁 ============ -->
  <section id="screen-intro" class="screen active">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div style="position:relative;">
      <div class="intro-badge">TAIWAN ENVIRONMENT QUIZ</div>

    <div class="meter-list" id="rMeters"></div>

    <div class="section-title">推薦給你的資源</div>
    <div id="rResources"></div>

    <div class="section-title">好玩小任務</div>
    <div class="task-box" id="rTask"></div>

    <div class="result-actions">
      <button class="btn-secondary" onclick="restartQuiz()" style="flex:1">🔄 重新測驗</button>
      <button class="btn-primary" onclick="shareResult()" style="flex:1">📤 分享結果</button>
    </div>
    <div class="share-note" id="shareNote"></div>

    <div class="footer-credit">堉璘臺大人才培育計畫 · 環保性向測驗原型<br>結果僅供娛樂與議題探索參考</div>
  </section>

</div>

    tagline: "你等不及了，想現在就開始改變。",
    tags: ["#氣候公民", "#淨零世代", "#政策控"],
    desc: "極端氣候的新聞你不會滑過去。你關心的是系統性的問題——能源怎麼來、政策夠不夠積極，也願意花時間搞懂複雜的議題，用行動去推一把。",
    resources: [
      { name: "台灣青年氣候聯盟 TWYCC", url: "https://www.twycc.org.tw/", desc: "由青年組成，長期參與國際氣候談判與國內倡議。" },
      { name: "台灣氣候行動網絡 TCAN", url: "https://tcan2050.org.tw/", desc: "氣候政策研究與淨零倡議智庫。" },
      { name: "綠色和平（台灣）", url: "https://www.greenpeace.org/taiwan/", desc: "國際環保組織台灣分部，長期關注氣候與能源議題倡議。" }
    ],
    task: "花 5 分鐘算一次自己的碳足跡，找出一件這個月可以改的小事（少一次外送、多一次騎車通勤）。"
  },
  circular: {
    name: "日常實踐家",
    emoji: "♻️",
    color: "var(--c-circular)",
    tagline: "你相信改變世界，可以從一個杯子開始。",
    tags: ["#極簡生活家", "#循環控", "#日常小革命"],
    desc: "你在乎的不是遙遠的議題，而是「我今天可以做什麼」。減塑、循環容器、二手交換——你把環保活成生活習慣，用一個個小選擇累積成改變。",
    resources: [
      { name: "好盒器 GoodToGo", url: "https://goodtogo.tw/", desc: "全台最大循環容器／循環杯借還系統。" },
      { name: "5% Design Action 社會設計平台", url: "https://5percent-design-action.com/", desc: "社會設計 × 永續生活的行動平台，常有可實際參與的專案。" },
      { name: "RE-THINK 重新思考", url: "https://rethinktw.org/", desc: "減塑教育與生活實踐倡議。" }
    ],
    task: "這週去一間有用循環杯／循環容器的店家消費一次，拍照打卡分享。"
  }
};

// 四個類別的固定顯示順序（重要：這個順序通過色盲辨識度驗證，
// 相鄰兩色的組合已經測試過可以清楚分辨，請不要任意調換順序）
const CAT_ORDER = ["ocean", "climate", "forest", "circular"];

/* ================================================================
   邏輯區：以下不需要為了新增題目/資源而修改。
   ================================================================ */

let currentQuestion = 0;
let answers = []; // 存放每題選的 type

function startQuiz() {
  currentQuestion = 0;
  answers = [];
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQuestion];
  document.getElementById('questionText').textContent = q.text;
  document.getElementById('progressLabel').textContent = (currentQuestion + 1) + ' / ' + QUESTIONS.length;
  document.getElementById('progressFill').style.width = ((currentQuestion) / QUESTIONS.length * 100) + '%';
  document.getElementById('backLink').style.visibility = currentQuestion === 0 ? 'hidden' : 'visible';

  const wrap = document.getElementById('optionsWrap');
  wrap.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.label;
    btn.onclick = () => selectAnswer(opt.type, btn);
    wrap.appendChild(btn);
  });
}

function selectAnswer(type, btnEl) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btnEl.classList.add('selected');
  answers[currentQuestion] = type;

  setTimeout(() => {
    if (currentQuestion < QUESTIONS.length - 1) {
      currentQuestion++;
      renderQuestion();
    } else {
      document.getElementById('progressFill').style.width = '100%';
      finishQuiz();
    }
  }, 250);
}

function prevQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

function finishQuiz() {
  showScreen('screen-loading');
  const messages = ["正在分析你的護島性格⋯", "正在翻閱台灣的海岸線與山稜線⋯", "正在計算你的護島指數⋯"];
  document.getElementById('loadingText').textContent = messages[Math.floor(Math.random() * messages.length)];
  setTimeout(() => {
    showResult(answers);
  }, 1100);
}

// 計分規則：每題選中的類別 +4 分、其餘三個類別各 +1 分（模擬真實心理測驗
// 「主要傾向 + 次要傾向都會被記錄」的做法），最後換算成百分比指數。
// 這個算法讓指數不會只是死板的「答對幾題」，而是比較接近性格測驗的手感。
function computeScores(answerList) {
  const totals = { ocean: 0, forest: 0, climate: 0, circular: 0 };
  answerList.forEach(chosen => {
    CAT_ORDER.forEach(cat => {
      totals[cat] += (cat === chosen) ? 4 : 1;
    });
  });
  const grand = Object.values(totals).reduce((a, b) => a + b, 0);
  const pct = {};
  CAT_ORDER.forEach(cat => { pct[cat] = Math.round(totals[cat] / grand * 100); });
  return pct;
}

function pickPrimaryType(pct, answerList) {
  let maxVal = Math.max(...Object.values(pct));
  let tied = CAT_ORDER.filter(cat => pct[cat] === maxVal);
  if (tied.length === 1) return tied[0];
  // 平手時，以最後一題的選擇當作決勝
  const lastAnswer = answerList[answerList.length - 1];
  return tied.includes(lastAnswer) ? lastAnswer : tied[0];
}

function showResult(answerList) {
  const pct = computeScores(answerList);
  const primary = pickPrimaryType(pct, answerList);
  const type = RESULT_TYPES[primary];

  document.getElementById('rEmoji').textContent = type.emoji;
  document.getElementById('rName').textContent = type.name;
  document.getElementById('rTagline').textContent = '「' + type.tagline + '」';
  document.getElementById('rDesc').textContent = type.desc;

  const tagWrap = document.getElementById('rTags');
  tagWrap.innerHTML = '';
  type.tags.forEach(t => {
    const span = document.createElement('span');
    span.className = 'tag-pill';
    span.textContent = t;
    tagWrap.appendChild(span);
  });

  const meterWrap = document.getElementById('rMeters');
  meterWrap.innerHTML = '';
  CAT_ORDER.forEach(cat => {
    const rt = RESULT_TYPES[cat];
    const row = document.createElement('div');
    row.className = 'meter-row';
    row.innerHTML =
      '<div class="meter-label-row">' +
        '<span class="meter-label">' + rt.emoji + ' ' + labelName(cat) + '</span>' +
        '<span class="meter-value">' + pct[cat] + '</span>' +
      '</div>' +
      '<div class="meter-track"><div class="meter-fill" style="width:' + pct[cat] + '%;background:' + rt.color + '"></div></div>';
    meterWrap.appendChild(row);
  });

  const resWrap = document.getElementById('rResources');
  resWrap.innerHTML = '';
  type.resources.forEach(r => {
    const card = document.createElement('div');
    card.className = 'resource-card';
    card.innerHTML =
      '<a href="' + r.url + '" target="_blank" rel="noopener">' + r.name + ' ↗</a>' +
      '<div class="resource-desc">' + r.desc + '</div>';
    resWrap.appendChild(card);
  });

  document.getElementById('rTask').innerHTML = '<strong>試試看</strong>' + type.task;

  showScreen('screen-result');
  document.getElementById('shareNote').textContent = '';
}

// 指數標籤用的議題名稱（比人格名稱更直白，方便閱讀百分比條）
function labelName(cat) {
  const names = { ocean: "海洋關注指數", forest: "山林關注指數", climate: "氣候關注指數", circular: "循環經濟指數" };
  return names[cat];
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function restartQuiz() {
  // history.replaceState can throw in sandboxed previews / some file:// contexts —
  // never let that block the actual screen switch.
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ }
  answers = [];
  currentQuestion = 0;
  showScreen('screen-intro');
}

// 分享：把 10 題的答案編碼進網址 (?a=0102...)，別人打開連結會直接看到
// 「你測出的結果」，不用重測，藉此提高分享後被點開的意願。
function encodeAnswers(answerList) {
  return answerList.map(a => CAT_ORDER.indexOf(a)).join('');
}
function decodeAnswers(code) {
  return code.split('').map(ch => CAT_ORDER[parseInt(ch, 10)]).filter(Boolean);
}

function shareResult() {
  const code = encodeAnswers(answers);
  let url;
  try {
    url = location.origin + location.pathname + '?a=' + code;
  } catch (e) {
    url = location.href.split('?')[0] + '?a=' + code;
  }
  const note = document.getElementById('shareNote');
  const typeName = RESULT_TYPES[pickPrimaryType(computeScores(answers), answers)].name;

  // 保底方案：不管 Web Share API / Clipboard API 能不能用（在預覽用的沙盒環境、
  // 或非 https 的情況下常常會被瀏覽器擋掉），一定要讓使用者看得到、選得到這個連結。
  function showFallbackLink() {
    note.innerHTML =
      '複製這段連結分享給朋友：' +
      '<input type="text" readonly value="' + url + '" ' +
      'onclick="this.select()" ' +
      'style="display:block;width:100%;margin-top:6px;padding:9px 10px;border-radius:8px;' +
      'border:1px solid var(--border-hairline);font-size:12px;box-sizing:border-box;">';
    const input = note.querySelector('input');
    if (input) { input.focus(); input.select(); }
  }

  if (navigator.share) {
    navigator.share({
      title: '你是哪種護島人？',
      text: '我測出了「' + typeName + '」，換你測測看！',
      url: url
    }).catch(showFallbackLink);
    return;
  }

  if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(() => { note.textContent = '連結已複製，貼給朋友就可以了 ✅'; })
      .catch(showFallbackLink);
    return;
  }

  // 非安全環境（file:// 本機開啟、沒有 https 的預覽視窗等）Clipboard API 本來就不能用，
  // 直接給可選取的連結，不要讓按鈕看起來像沒反應。
  showFallbackLink();
}

// 若網址帶有 ?a=...，代表是被分享進來的，直接顯示結果不用重玩
(function initFromShareLink() {
  const params = new URLSearchParams(location.search);
  const code = params.get('a');
  if (code && /^[0-3]+$/.test(code)) {
    answers = decodeAnswers(code);
    if (answers.length > 0) {
      showResult(answers);
      return;
    }
  }
  showScreen('screen-intro');
})();
</script>
